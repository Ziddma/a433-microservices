name: CI for karsajobs

on:
  push:
    branches:
      - karsajobs

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: karsajobs

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Debug directory structure
        run: |
          echo "Current working directory:"
          pwd
          echo "Contents of working directory:"
          ls -l

      - name: Install Hadolint and Lint Dockerfile
        run: |
          wget -O hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x hadolint
          ./hadolint Dockerfile

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.20

      - name: Run unit tests
        run: go test -v -short --count=1 $(go list ./...)

      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/karsajobs:latest .
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/karsajobs:latest
